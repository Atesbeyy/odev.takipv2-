<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ödev Takip iOS Edition</title>
  
  <!-- 📱 ANA EKRAN UYGULAMA SİMGESİ (APP ICON) -->
  <!-- Aşağıdaki "FOTOGRAFININ_LINKI.jpg" kısmına kendi fotoğrafının doğrudan linkini yapıştır -->
  <link rel="apple-touch-icon" href="FOTOGRAFININ_LINKI.jpg">
  <meta name="apple-mobile-web-app-title" content="Ödev Takip">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    :root {
      --bg: #f2f2f7;
      --card-bg: rgba(255, 255, 255, 0.75);
      --card-solid: #ffffff;
      --text: #000000;
      --sub-text: #8e8e93;
      --accent: #007aff;
      --green: #34c759;
      --red: #ff3b30;
      --orange: #ff9500;
      --border: rgba(60, 60, 67, 0.08);
      --input-bg: rgba(118, 118, 128, 0.12);
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
    }

    [data-theme="dark"] {
      --bg: #000000;
      --card-bg: rgba(28, 28, 30, 0.75);
      --card-solid: #1c1c1e;
      --text: #ffffff;
      --sub-text: #8e8e93;
      --accent: #0a84ff;
      --border: rgba(255, 255, 255, 0.12);
      --input-bg: rgba(118, 118, 128, 0.24);
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 120px; transition: background 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    .app { max-width: 600px; margin: 0 auto; padding: 16px; }

    /* 🚀 SPLASH SCREEN (AÇILIŞ EKRANI) */
    #splash-screen {
      position: fixed;
      inset: 0;
      background: #000000;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.6s;
    }

    #splash-screen.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-title {
      font-size: 32px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -0.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #ffffff, #8e8e93);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .splash-author {
      font-size: 14px;
      font-weight: 800;
      color: #0a84ff;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* Header */
    .header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px; padding-top: 8px; }
    .greeting { font-size: 12px; color: var(--sub-text); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .app-title { font-size: 34px; font-weight: 800; letter-spacing: -1px; margin-top: 2px; }
    
    .streak-badge { background: linear-gradient(135deg, #ff9500, #ff2d55); color: white; padding: 8px 16px; border-radius: 20px; font-weight: 800; font-size: 13px; display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 14px rgba(255, 149, 0, 0.35); }

    /* Summary Grid */
    .summary-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
    .summary-card { background: var(--card-bg); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); padding: 16px; border-radius: 22px; display: flex; align-items: center; justify-content: space-between; border: 0.5px solid var(--border); cursor: pointer; transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: var(--shadow); }
    .summary-card:active { transform: scale(0.96); }
    .summary-card.active-filter { border: 2px solid var(--accent); }
    .summary-info span { font-size: 12px; color: var(--sub-text); font-weight: 600; display: block; }
    .summary-info b { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
    .badge-icon { width: 42px; height: 42px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .bg-red { background: rgba(255, 59, 48, 0.12); }
    .bg-orange { background: rgba(255, 149, 0, 0.12); }
    .bg-blue { background: rgba(0, 122, 255, 0.12); }
    .bg-green { background: rgba(52, 199, 89, 0.12); }

    /* Inputs & Filters */
    .search-box input { width: 100%; padding: 14px 18px; border-radius: 16px; border: 0.5px solid var(--border); background: var(--card-bg); color: var(--text); font-size: 15px; outline: none; margin-bottom: 14px; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: var(--shadow); }
    
    .filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 20px; scrollbar-width: none; }
    .filters::-webkit-scrollbar { display: none; }
    .filter-chip { background: var(--card-bg); color: var(--sub-text); border: 0.5px solid var(--border); padding: 9px 18px; border-radius: 22px; font-size: 13px; font-weight: 700; white-space: nowrap; cursor: pointer; transition: all 0.2s; backdrop-filter: blur(20px); }
    .filter-chip.active { background: var(--accent); color: white; border-color: var(--accent); box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3); }

    /* Task Card */
    .task-card { background: var(--card-bg); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border-radius: 22px; padding: 18px; margin-bottom: 14px; border: 0.5px solid var(--border); display: flex; gap: 14px; align-items: center; transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: var(--shadow); }
    .task-card.completed-card { opacity: 0.45; }
    
    .check-btn { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--sub-text); background: transparent; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 15px; color: white; transition: all 0.2s; }
    .check-btn.checked { background: var(--green); border-color: var(--green); }

    .task-body { flex: 1; min-width: 0; cursor: pointer; }
    .task-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .subject-tag { font-size: 11px; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px; }
    .pub-tag { font-size: 12px; font-weight: 700; color: var(--sub-text); }
    .task-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
    .task-title.strike { text-decoration: line-through; opacity: 0.8; }
    .task-meta { display: flex; gap: 12px; font-size: 12px; color: var(--sub-text); margin-bottom: 10px; font-weight: 500; }
    
    .progress-bar-bg { background: var(--input-bg); height: 7px; border-radius: 4px; overflow: hidden; }
    .progress-bar-fill { background: var(--accent); height: 100%; border-radius: 4px; transition: width 0.3s ease; }
    .progress-text { display: flex; justify-content: space-between; font-size: 11px; color: var(--sub-text); margin-top: 6px; font-weight: 700; }

    /* Modal */
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.35); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); display: none; align-items: flex-end; justify-content: center; z-index: 100; transition: all 0.3s; }
    .modal.active { display: flex; }
    .modal-content { background: var(--card-solid); width: 100%; max-width: 600px; border-radius: 32px 32px 0 0; padding: 26px; max-height: 90vh; overflow-y: auto; box-shadow: 0 -10px 40px rgba(0,0,0,0.15); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
    .close-btn { background: var(--input-bg); border: none; width: 32px; height: 32px; border-radius: 50%; color: var(--sub-text); font-weight: 700; cursor: pointer; }

    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-size: 11px; font-weight: 800; color: var(--sub-text); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-control { width: 100%; padding: 15px; border-radius: 16px; border: 0.5px solid var(--border); background: var(--input-bg); color: var(--text); font-size: 16px; outline: none; }
    
    .btn { width: 100%; padding: 16px; border-radius: 18px; border: none; font-size: 16px; font-weight: 700; cursor: pointer; transition: transform 0.15s; }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--accent); color: white; box-shadow: 0 4px 14px rgba(0, 122, 255, 0.3); }
    .btn-danger { background: rgba(255, 59, 48, 0.12); color: var(--red); margin-top: 10px; }

    .counter-grid { display: flex; gap: 8px; margin: 18px 0; }
    .btn-counter { flex: 1; padding: 14px; background: var(--input-bg); border: none; border-radius: 14px; font-weight: 800; color: var(--text); font-size: 16px; cursor: pointer; }

    /* Navbar */
    .navbar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border-top: 0.5px solid var(--border); display: flex; justify-content: space-around; padding: 12px 0 28px 0; max-width: 600px; margin: 0 auto; z-index: 90; }
    .nav-item { border: none; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--sub-text); font-size: 10px; font-weight: 700; cursor: pointer; width: 25%; }
    .nav-item.active { color: var(--accent); }
    .nav-item span { font-size: 22px; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body>

  <!-- 🚀 AÇILIŞ EKRANI -->
  <div id="splash-screen">
    <div class="splash-title">ÖDEV TAKİP ÇİZELGESİ</div>
    <div class="splash-author">BY ATEŞ SEPETÇİ</div>
  </div>

  <main class="app">
    <!-- 🏠 ANA SAYFA -->
    <section id="tab-home" class="tab-content active">
      <header class="header">
        <div>
          <div class="greeting" id="user-greeting">Hoş Geldin 👋</div>
          <h1 class="app-title">Ödev Takip</h1>
        </div>
        <div class="streak-badge">
          🔥 <span id="streak-count">0</span> Gün
        </div>
      </header>

      <!-- Özet Sayaçlar -->
      <div class="summary-grid">
        <div class="summary-card" id="card-overdue" onclick="applyStatusFilter('overdue')">
          <div class="summary-info"><span>Geciken</span><b id="cnt-overdue">0</b></div>
          <div class="badge-icon bg-red">🔴</div>
        </div>
        <div class="summary-card" id="card-today" onclick="applyStatusFilter('today')">
          <div class="summary-info"><span>Bugün</span><b id="cnt-today">0</b></div>
          <div class="badge-icon bg-orange">🟠</div>
        </div>
        <div class="summary-card" id="card-upcoming" onclick="applyStatusFilter('upcoming')">
          <div class="summary-info"><span>Yaklaşan</span><b id="cnt-upcoming">0</b></div>
          <div class="badge-icon bg-blue">🔵</div>
        </div>
        <div class="summary-card" id="card-completed" onclick="applyStatusFilter('completed')">
          <div class="summary-info"><span>Tamamlanan</span><b id="cnt-completed">0</b></div>
          <div class="badge-icon bg-green">🟢</div>
        </div>
      </div>

      <div class="search-box">
        <input type="text" id="search-input" placeholder="Ders, yayın veya konu ara..." oninput="renderTasks()">
      </div>

      <!-- Filtreler -->
      <div class="filters" id="subject-filters">
        <button class="filter-chip active" onclick="setSubjectFilter('Tümü', this)">Tümü</button>
        <button class="filter-chip" onclick="setSubjectFilter('Sayısal', this)">Sayısal</button>
        <button class="filter-chip" onclick="setSubjectFilter('Eşit Ağırlık', this)">Eşit Ağırlık</button>
        <button class="filter-chip" onclick="setSubjectFilter('Matematik', this)">Matematik</button>
        <button class="filter-chip" onclick="setSubjectFilter('Türkçe', this)">Türkçe</button>
      </div>

      <div id="task-list"></div>
    </section>

    <!-- 📊 İSTATİSTİK -->
    <section id="tab-stats" class="tab-content">
      <header class="header"><h1 class="app-title">İstatistikler</h1></header>
      <div class="summary-card" style="flex-direction:column; text-align:center; padding: 36px 20px; cursor:default;">
        <h3 style="color: var(--sub-text); font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px;">Genel Tamamlanma</h3>
        <h2 id="stats-pct" style="font-size: 56px; font-weight:800; color: var(--accent); margin: 8px 0; letter-spacing: -1px;">%0</h2>
        <p style="color: var(--sub-text); font-weight: 500;" id="stats-detail">0 ödevden 0 tanesi tamamlandı.</p>
      </div>
    </section>

    <!-- ⚙️ AYARLAR -->
    <section id="tab-settings" class="tab-content">
      <header class="header"><h1 class="app-title">Ayarlar</h1></header>
      <div class="summary-card" style="flex-direction:column; align-items:stretch; gap: 16px; cursor:default;">
        <div class="form-group">
          <label>Kullanıcı Adın</label>
          <input type="text" id="inp-username" class="form-control" placeholder="Adını yaz..." onchange="saveUsername(this.value)">
        </div>
        <button class="btn btn-primary" onclick="toggleTheme()">🌙 Tema Değiştir</button>
      </div>
    </section>
  </main>

  <!-- ➕ ÖDEV EKLE MODAL -->
  <div class="modal" id="add-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Yeni Ödev Ekle</h2>
        <button class="close-btn" onclick="closeModal('add-modal')">✕</button>
      </div>
      <form onsubmit="saveTask(event)">
        <div class="form-group">
          <label>Ders</label>
          <select id="inp-subject" class="form-control" required>
            <option value="Matematik">Matematik</option>
            <option value="Fizik">Fizik</option>
            <option value="Kimya">Kimya</option>
            <option value="Biyoloji">Biyoloji</option>
            <option value="Türkçe">Türkçe</option>
            <option value="Edebiyat">Edebiyat</option>
            <option value="Tarih">Tarih</option>
            <option value="Coğrafya">Coğrafya</option>
            <option value="Diğer">Diğer</option>
          </select>
        </div>
        <div class="form-group"><label>Yayın</label><input type="text" id="inp-publisher" class="form-control" placeholder="Örn: 345" required></div>
        <div class="form-group"><label>Konu</label><input type="text" id="inp-topic" class="form-control" placeholder="Örn: Türev - İntegral" required></div>
        <div class="form-group"><label>Sayfa veya Test Miktarı</label><input type="text" id="inp-range" class="form-control" placeholder="Örn: 100-150 veya 3 test" required></div>
        <div class="form-group"><label>Son Teslim Tarihi</label><input type="date" id="inp-due" class="form-control" required></div>
        <button type="submit" class="btn btn-primary">Kaydet</button>
      </form>
    </div>
  </div>

  <!-- 👆 DETAY MODAL -->
  <div class="modal" id="detail-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="det-title">Detay</h2>
        <button class="close-btn" onclick="closeModal('detail-modal')">✕</button>
      </div>
      <div style="color: var(--sub-text); font-size: 14px; margin-bottom: 18px; font-weight: 500;" id="det-meta"></div>
      
      <div class="form-group">
        <label id="det-input-label">Tamamlanan Miktar</label>
        <input type="number" id="det-completed" class="form-control">
      </div>

      <div class="counter-grid">
        <button class="btn-counter" onclick="adjustProgress(-5)">-5</button>
        <button class="btn-counter" onclick="adjustProgress(-1)">-1</button>
        <button class="btn-counter" onclick="adjustProgress(1)">+1</button>
        <button class="btn-counter" onclick="adjustProgress(5)">+5</button>
      </div>

      <button class="btn btn-primary" onclick="saveDetailEdit()">Kaydet</button>
      <button class="btn btn-danger" onclick="deleteCurrentTask()">🗑️ Ödevi Sil</button>
    </div>
  </div>

  <!-- Navbar -->
  <nav class="navbar">
    <button class="nav-item active" onclick="switchTab('home', this)"><span>🏠</span>Ana Sayfa</button>
    <button class="nav-item" onclick="openAddModal()"><span>➕</span>Ödev Ekle</button>
    <button class="nav-item" onclick="switchTab('stats', this)"><span>📊</span>İstatistik</button>
    <button class="nav-item" onclick="switchTab('settings', this)"><span>⚙️</span>Ayarlar</button>
  </nav>

  <script>
    const DB_NAME = "odev_app_v3_2";
    let tasks = [];
    let selectedSubject = "Tümü";
    let selectedStatusFilter = null;
    let currentDetailId = null;

    const SAYISAL_DERSLER = ["Matematik", "Fizik", "Kimya", "Biyoloji"];
    const ESIT_AGIRLIK_DERSLER = ["Matematik", "Türkçe", "Edebiyat", "Tarih", "Coğrafya"];

    // Otomatik Giriş (Splash Screen Kontrolü)
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const splash = document.getElementById('splash-screen');
        if (splash) splash.classList.add('fade-out');
      }, 2500);
    });

    function init() {
      try {
        tasks = JSON.parse(localStorage.getItem(DB_NAME) || "[]");
      } catch (e) {
        tasks = [];
      }

      const name = localStorage.getItem("odev_user") || "";
      if (name) {
        document.getElementById('user-greeting').innerText = `Hoş Geldin, ${name} 👋`;
        document.getElementById('inp-username').value = name;
      }
      
      const dueInp = document.getElementById('inp-due');
      if (dueInp) dueInp.valueAsDate = new Date();

      saveData();
    }

    function saveUsername(val) {
      localStorage.setItem("odev_user", val.trim());
      document.getElementById('user-greeting').innerText = val.trim() ? `Hoş Geldin, ${val.trim()} 👋` : "Hoş Geldin 👋";
    }

    function parseAmountAndUnit(rangeStr) {
      if (!rangeStr) return { total: 10, unit: "sayfa" };
      const str = rangeStr.toLowerCase().trim();
      const isTest = str.includes("test");
      const unit = isTest ? "test" : "sayfa";

      const matchRange = str.match(/(\d+)\s*[-–]\s*(\d+)/);
      if (matchRange) {
        const start = parseInt(matchRange[1]);
        const end = parseInt(matchRange[2]);
        const total = Math.abs(end - start) + 1;
        return { total, unit };
      }

      const matchSingle = str.match(/\d+/);
      const total = matchSingle ? parseInt(matchSingle[0]) : 10;
      return { total, unit };
    }

    function getTaskCategory(t) {
      if (t.completed || t.completedCount >= t.totalCount) return "completed";
      const todayStr = new Date().toISOString().split('T')[0];
      if (t.dueDate < todayStr) return "overdue";
      if (t.dueDate === todayStr) return "today";
      return "upcoming";
    }

    function toggleTask(id, e) {
      if (e) e.stopPropagation();
      const t = tasks.find(x => x.id === id);
      if (t) {
        t.completed = !t.completed;
        if (t.completed) {
          t.completedCount = t.totalCount;
          t.completedAt = new Date().toISOString().split('T')[0];
        } else {
          t.completedCount = 0;
          t.completedAt = null;
        }
        saveData();
      }
    }

    function calculateStreak() {
      const dates = [...new Set(tasks.filter(t => t.completed && t.completedAt).map(t => t.completedAt))].sort().reverse();
      let streak = 0;
      let check = new Date();

      for (let i = 0; i < 30; i++) {
        const dStr = check.toISOString().split('T')[0];
        if (dates.includes(dStr)) {
          streak++;
          check.setDate(check.getDate() - 1);
        } else if (i === 0) {
          check.setDate(check.getDate() - 1);
        } else {
          break;
        }
      }
      document.getElementById('streak-count').innerText = streak;
    }

    function saveData() {
      localStorage.setItem(DB_NAME, JSON.stringify(tasks));
      renderDashboard();
      renderTasks();
      calculateStreak();
    }

    function renderDashboard() {
      const counts = { overdue: 0, today: 0, upcoming: 0, completed: 0 };
      tasks.forEach(t => counts[getTaskCategory(t)]++);

      document.getElementById('cnt-overdue').innerText = counts.overdue;
      document.getElementById('cnt-today').innerText = counts.today;
      document.getElementById('cnt-upcoming').innerText = counts.upcoming;
      document.getElementById('cnt-completed').innerText = counts.completed;

      const total = tasks.length;
      const comp = counts.completed;
      const pct = total ? Math.round((comp / total) * 100) : 0;
      document.getElementById('stats-pct').innerText = `%${pct}`;
      document.getElementById('stats-detail').innerText = `${total} ödevden ${comp} tanesi tamamlandı.`;
    }

    function renderTasks() {
      const container = document.getElementById('task-list');
      const search = (document.getElementById('search-input').value || "").toLowerCase();

      let filtered = tasks.filter(t => {
        let matchesSubject = false;
        if (selectedSubject === "Tümü") matchesSubject = true;
        else if (selectedSubject === "Sayısal") matchesSubject = SAYISAL_DERSLER.includes(t.subject);
        else if (selectedSubject === "Eşit Ağırlık") matchesSubject = ESIT_AGIRLIK_DERSLER.includes(t.subject);
        else matchesSubject = t.subject === selectedSubject;

        const matchesSearch = (t.topic || "").toLowerCase().includes(search) || (t.publisher || "").toLowerCase().includes(search);
        const matchesStatus = !selectedStatusFilter || getTaskCategory(t) === selectedStatusFilter;
        return matchesSubject && matchesSearch && matchesStatus;
      });

      if (!filtered.length) {
        container.innerHTML = `<div style="text-align:center; padding:40px; color:var(--sub-text); font-weight:600;">Gösterilecek ödev bulunamadı.</div>`;
        return;
      }

      container.innerHTML = filtered.map(t => {
        const isDone = t.completed || t.completedCount >= t.totalCount;
        const total = t.totalCount || 10;
        const current = t.completedCount || 0;
        const pct = Math.min(100, Math.round((current / total) * 100));
        const unitText = t.unit || "sayfa";

        return `
          <div class="task-card ${isDone ? 'completed-card' : ''}">
            <button class="check-btn ${isDone ? 'checked' : ''}" onclick="toggleTask('${t.id}', event)">
              ${isDone ? '✓' : ''}
            </button>
            <div class="task-body" onclick="openDetailModal('${t.id}')">
              <div class="task-header">
                <span class="subject-tag">${t.subject}</span>
                <span class="pub-tag">${t.publisher}</span>
              </div>
              <div class="task-title ${isDone ? 'strike' : ''}">${t.topic}</div>
              <div class="task-meta">
                <span>📖 ${t.range}</span>
                <span>📅 ${(t.dueDate || '').split('-').reverse().slice(0,2).join('/')}</span>
              </div>
              <div class="progress-bar-bg">
                <div class="progress-bar-fill" style="width: ${pct}%"></div>
              </div>
              <div class="progress-text">
                <span>${current} / ${total} ${unitText}</span>
                <span>%${pct}</span>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function openAddModal() { document.getElementById('add-modal').classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    function saveTask(e) {
      e.preventDefault();
      const range = document.getElementById('inp-range').value;
      const parsed = parseAmountAndUnit(range);

      tasks.push({
        id: Date.now().toString(),
        subject: document.getElementById('inp-subject').value,
        publisher: document.getElementById('inp-publisher').value,
        topic: document.getElementById('inp-topic').value,
        range: range,
        totalCount: parsed.total,
        unit: parsed.unit,
        completedCount: 0,
        dueDate: document.getElementById('inp-due').value,
        completed: false
      });

      saveData();
      closeModal('add-modal');
      e.target.reset();
    }

    function openDetailModal(id) {
      currentDetailId = id;
      const t = tasks.find(x => x.id === id);
      if (!t) return;

      const unitText = t.unit || "sayfa";
      document.getElementById('det-title').innerText = `${t.subject} — ${t.topic}`;
      document.getElementById('det-meta').innerText = `Yayın: ${t.publisher} • Son Tarih: ${t.dueDate}`;
      document.getElementById('det-input-label').innerText = `TAMAMLANAN ${unitText.toUpperCase()} SAYISI`;
      document.getElementById('det-completed').value = t.completedCount || 0;
      document.getElementById('detail-modal').classList.add('active');
    }

    function adjustProgress(delta) {
      const inp = document.getElementById('det-completed');
      let val = (parseInt(inp.value) || 0) + delta;
      const t = tasks.find(x => x.id === currentDetailId);
      if (t) {
        val = Math.max(0, Math.min(t.totalCount, val));
      }
      inp.value = val;
    }

    function saveDetailEdit() {
      const t = tasks.find(x => x.id === currentDetailId);
      if (t) {
        t.completedCount = parseInt(document.getElementById('det-completed').value) || 0;
        t.completed = t.completedCount >= t.totalCount;
        if (t.completed) t.completedAt = new Date().toISOString().split('T')[0];
        else t.completedAt = null;
        saveData();
        closeModal('detail-modal');
      }
    }

    function deleteCurrentTask() {
      const idx = tasks.findIndex(x => x.id === currentDetailId);
      if (idx > -1) {
        tasks.splice(idx, 1);
        saveData();
        closeModal('detail-modal');
      }
    }

    function setSubjectFilter(subj, el) {
      selectedSubject = subj;
      document.querySelectorAll('#subject-filters .filter-chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      renderTasks();
    }

    function applyStatusFilter(status) {
      if (selectedStatusFilter === status) {
        selectedStatusFilter = null;
        document.querySelectorAll('.summary-card').forEach(c => c.classList.remove('active-filter'));
      } else {
        selectedStatusFilter = status;
        document.querySelectorAll('.summary-card').forEach(c => c.classList.remove('active-filter'));
        document.getElementById('card-' + status).classList.add('active-filter');
      }
      renderTasks();
    }

    function switchTab(tab, el) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
      if (el) el.classList.add('active');
    }

    function toggleTheme() {
      const b = document.body;
      b.setAttribute('data-theme', b.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    }

    init();
  </script>
</body>
</html>
