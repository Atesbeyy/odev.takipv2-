name: Build Android AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Initialize and Configure TWA
        run: |
          bubblewrap init --manifest=https://raw.githubusercontent.com/${{ github.repository }}/main/manifest.json --directory=.
          node -e '
            const fs = require("fs");
            if (fs.existsSync("twa-manifest.json")) {
              const twa = JSON.parse(fs.readFileSync("twa-manifest.json", "utf8"));
              twa.minSdkVersion = 24;
              twa.targetSdkVersion = 35;
              twa.appVersionCode = 2;
              twa.appVersionName = "1.0.1";
              twa.packageId = "io.github.atesbeyy.twa";
              fs.writeFileSync("twa-manifest.json", JSON.stringify(twa, null, 2));
              console.log("twa-manifest.json guncellendi: minSdkVersion=24, targetSdkVersion=35, versionCode=2");
            }
          '
          find . -name "build.gradle*" -exec sed -i 's/minSdkVersion 23/minSdkVersion 24/g' {} + || true
          find . -name "build.gradle*" -exec sed -i 's/minSdk = 23/minSdk = 24/g' {} + || true

      - name: Build TWA AAB
        run: bubblewrap build --skipPwaValidation || bubblewrap build

      - name: Upload Generated AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: '*.aab'
